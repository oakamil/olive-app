[package]
name = "olive-ios"
version = "0.1.0"
edition = "2024"

[lib]
name = "olive_ios"
crate-type = ["staticlib"]

[dependencies]
olive-engine = { path = "../../../olive-engine" }
olive-solve = { git = "https://github.com/oakamil/olive-solve.git" }
olive-imu = { git = "https://github.com/oakamil/olive-solve.git" }
tokio = { version = "1.37.0", features = ["rt-multi-thread", "sync"] }
log = "0.4"
nalgebra = "0.35.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
starfield = "0.10.2"
oslog = "0.2.0"

[profile.dev]
opt-level = 3
debug = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
