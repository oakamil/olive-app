name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout olive-app
        uses: actions/checkout@v4
        with:
          path: olive-app

      - name: Checkout sibling olive-engine
        uses: actions/checkout@v4
        with:
          repository: oakamil/olive-engine
          path: olive-engine

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Rust & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install cargo-ndk
        uses: taiki-e/install-action@cargo-ndk

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android unit tests & release APK build
        working-directory: olive-app
        run: ./gradlew :app:testReleaseUnitTest :app:assembleRelease

  ios:
    name: iOS Simulator Build
    runs-on: macos-15
    steps:
      - name: Checkout olive-app
        uses: actions/checkout@v4
        with:
          path: olive-app

      - name: Checkout sibling olive-engine
        uses: actions/checkout@v4
        with:
          repository: oakamil/olive-engine
          path: olive-engine

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Rust & iOS Simulator target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Xcode Simulator app (embeds KMP Shared framework & Rust olive-ios)
        working-directory: olive-app
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme "Olive Finder" \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
