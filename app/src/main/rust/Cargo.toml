[package]
name = "olive-jni"
version = "0.1.0"
edition = "2024"

[lib]
name = "olive_jni"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21.1"
olive-engine = { path = "../../../../../olive-engine" }
tokio = { version = "1.37.0", features = ["rt-multi-thread"] }
log = "0.4"
ndk-sys = "0.6.0"
openssl = { version = "0.10", features = ["vendored"] }