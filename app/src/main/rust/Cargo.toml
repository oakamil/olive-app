[package]
name = "olive-jni"
version = "0.1.0"
edition = "2024"

[lib]
name = "olive_jni"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21.1"
olive-engine = { path = "../../../../../olive-engine" }
tokio = { version = "1.37.0", features = ["rt-multi-thread"] }
log = "0.4"
android_logger = "0.13"
ndk-sys = "0.6.0"
openssl = { version = "0.10", features = ["vendored"] }
nalgebra = "0.32"
serde_json = "1.0.149"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
uvc = {git = "https://github.com/oakamil/libuvc-rs", features = ["vendor", "wrap_fd"]}
starfield = "0.10.2"

[patch."https://github.com/oakamil/libuvc-rs"]
uvc = { path = "../../../../../libuvc-rs" }

[patch.crates-io]
turbojpeg-sys = { path = "../../../../../rust-turbojpeg/turbojpeg-sys" }
